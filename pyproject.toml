[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-propagation-learning"
version = "0.1.0"
description = "Local-first, evidence-first content research loop MVP"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
collection = ["yt-dlp>=2024.1"]
analysis = ["duckdb>=1.0"]
extraction = ["faster-whisper>=1.0", "scenedetect>=0.6", "opencv-python>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
world-loop = "cli.main:main"
world-loop-web = "webui.server:main"

[tool.setuptools.packages.find]
include = ["core*", "plugins*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
